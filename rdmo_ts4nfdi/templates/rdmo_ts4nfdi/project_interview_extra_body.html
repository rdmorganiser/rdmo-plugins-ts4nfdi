{% load i18n %}
<div
    id="ts4nfdi-annotation-drawer"
    class="ts4nfdi-annotation-drawer"
    role="dialog"
    aria-modal="true"
    aria-labelledby="ts4nfdi-annotation-drawer-title"
    aria-hidden="true"
    hidden
>
    <button
        type="button"
        class="ts4nfdi-annotation-backdrop"
        data-ts4nfdi-close
        aria-label="{% translate 'Close terminology details' %}"
    ></button>
    <section class="ts4nfdi-annotation-panel" tabindex="-1">
        <header class="ts4nfdi-annotation-header">
            <div>
                <span class="ts4nfdi-annotation-eyebrow">TS4NFDI</span>
                <h2 id="ts4nfdi-annotation-drawer-title">{% translate "Terminology details" %}</h2>
            </div>
            <button
                type="button"
                class="ts4nfdi-annotation-close"
                data-ts4nfdi-close
                aria-label="{% translate 'Close terminology details' %}"
            >×</button>
        </header>
        <div id="ts4nfdi-annotation-summary" class="ts4nfdi-annotation-summary"></div>
        <div id="ts4nfdi-annotation-widget" class="ts4nfdi-annotation-widget"></div>
    </section>
</div>
