[defaults]
base_url = "https://terminology.services.base4nfdi.de/api-gateway"
search_param = "query"
limit = 30
timeout = 10
id_fields = ["iri", "uri", "id"]
label_fields = ["label", "prefLabel", "short_form", "name", "title"]
help_fields = ["descriptions", "description", "definition", "scopeNote", "summary"]
ontology_fields = ["ontology", "ontology_iri", "source_name", "sourceName", "backend_type", "short_form"]
show_request_errors = true
request_error_text = "TS4NFDI service is currently unavailable."
request_error_help = "Could not load options from the terminology service. Please try again later."

[gateway]
# The browser can reach only the allowlisted OLS proxy routes exposed by this
# plugin. Keep tokens server-side; they are never included in frontend config.
base_url = "https://terminology.services.base4nfdi.de/api-gateway"
timeout = 10
cache_timeout = 300
# api_token = "configure-via-a-secret-bearing-settings-source"

[sources.ebi]
label = "EBI"
database = "ebi"
backend_type = "ols2"
url = "https://www.ebi.ac.uk/ols4/api/v2"

[sources.agrovoc]
label = "FAO AGROVOC service"
database = "agrovoc"
backend_type = "skosmos"
url = "https://agrovoc.fao.org/browse/rest/v1"

[sources.agroportal]
label = "AgroPortal"
database = "agroportal"
backend_type = "ontoportal"
url = "https://data.agroportal.eu"

[sources.tib]
label = "TIB Terminology Service"
database = "tib"
backend_type = "ols2"
url = "https://api.terminology.tib.eu/api/v2"

[providers.ts4nfdi_ontologies]
endpoint = "search"
source_key = "ebi"
ontologies = ["edam"]
iri_prefixes = ["http://edamontology.org/format_"]
# Dataset question sets can legitimately select the same format in different
# set_prefix/set_index contexts. Do not exclude options selected elsewhere in
# the project.

[providers.ts4nfdi_agrovoc_keywords]
endpoint = "search"
source_key = "agrovoc"
ontologies = ["agrovoc"]
iri_prefixes = ["http://aims.fao.org/aos/agrovoc/"]
limit = 30

[providers.ts4nfdi_keywords]
endpoint = "search"
limit = 30

[providers.ts4nfdi_collections]
endpoint = "collections/"
id_fields = ["id"]
label_fields = ["label"]
help_fields = ["description"]
uri_fields = ["iri", "uri", "permalink", "permaLink", "permalinkUrl"]
permalink_base = "https://w3id.org/ts4nfdi/collection/"
terminology_badge_limit = 12
exclude_selected_collection_options = false
preserve_exact_selected_search = false
selected_match_fields = ["id", "uuid"]
exclude_selected_attribute_uris = ["https://rdmorganiser.github.io/terms/domain/project/dataset/metadata/standards"]

[providers.ts4nfdi_fairagro_collection_terminologies]
endpoint = "ols4/api/ontologies"
collection_id = "ff5491d1-d0a9-481e-ac90-0fad065fa097"
collection_label = "FAIRagro TS collection"
collection_id_param = "collectionId"
size = 500
page = 0
fallback_endpoint = "collections/"
# Keep the complete bounded collection available for RDMO's locally filtered
# browse select, including previously selected values.
limit = 500
id_fields = ["URI", "config.id", "uri", "ontologyId", "id"]
label_fields = ["config.title", "label", "ontologyId", "name", "title"]
help_fields = ["config.description", "description", "definition", "summary"]

# The FAIRagro data-generation question uses this public Gateway entity set.
# Each entity URI is returned directly as the dynamic RDMO option ID and is
# therefore preserved as Value.external_id by RDMO's normal provider flow.
[providers.ts4nfdi_entitysets]
endpoint = "entitysets/"
entityset_id = "fc45621d-7e40-47ce-9616-4133f0b54edf"
id_fields = ["id"]
label_fields = ["label"]
help_fields = ["description"]

[frontend]
# Public Gateway OLS4 endpoints are CORS-enabled. TSS-backed annotations use
# this direct browser route, so clicking an EDAM annotation bypasses both the
# legacy annotation-detail API and the RDMO Gateway proxy. Deployments with a
# private source, server-held credentials, or restrictive browser networking
# can override this with `mode = "proxy"`.
[frontend.gateway]
mode = "direct"

# Interview annotations are opt-in. Each matcher must identify the complete
# question/attribute/optionset combination.
[frontend.annotations]
enabled = true

# EDAM concepts selected on the first page of the example catalog. The
# historical provider class name says "ontologies", but the Gateway search
# returns entities/concepts and the current config restricts them to EDAM
# formats.
[[frontend.annotations.matchers]]
id = "example-edam-concept"
question_uri = "https://ts4nfdi.github.io/terms/questions/rdmo-plugins-ts4nfdi-example-catalog/ontologies"
attribute_uri = "https://ts4nfdi.github.io/domain/rdmo-plugins-ts4nfdi/ontologies"
optionset_uri = "https://ts4nfdi.github.io/terms/options/rdmo-plugins-ts4nfdi/ontologies"
resource_type = "entity"
badge_label = "EDAM"
ontology_id = "edam"
source_key = "ebi"
presentation = { adapter = "tss", component = "entity-info", entity_type = "class" }

# Public TS4NFDI collections selected on the first page of the example
# catalog. TSS currently has no collection component, so the normalized native
# detail view is used.
[[frontend.annotations.matchers]]
id = "example-collection"
question_uri = "https://ts4nfdi.github.io/terms/questions/rdmo-plugins-ts4nfdi-example-catalog/collections"
attribute_uri = "https://ts4nfdi.github.io/domain/rdmo-plugins-ts4nfdi/collections"
optionset_uri = "https://ts4nfdi.github.io/terms/options/rdmo-plugins-ts4nfdi/collections"
resource_type = "collection"
provider_key = "ts4nfdi_collections"
badge_label = "TS4NFDI collection"
# The selected collection's own description is retrieved only when its
# annotation is opened. This bypasses the generic terminology metadata resolver.
provider_resource_detail = true
presentation = { adapter = "native" }

# Complete terminologies selected from the provider's fixed FAIRAgro
# collection. The badge makes that preselected context visible in each
# annotation; the catalog question help explains that it is not controlled by
# the preceding collections answer. The native adapter is the reliable
# prototype default for Gateway terminology responses. Switch this matcher to
# `presentation = { adapter = "tss", component = "ontology-info" }` after the
# deployed Gateway response has been verified against the vendored TSS release.
[[frontend.annotations.matchers]]
id = "example-fairagro-collection-terminology"
question_uri = "https://ts4nfdi.github.io/terms/questions/rdmo-plugins-ts4nfdi-example-catalog/collection-terminologies"
attribute_uri = "https://ts4nfdi.github.io/domain/rdmo-plugins-ts4nfdi/collection-terminologies"
optionset_uri = "https://ts4nfdi.github.io/terms/options/rdmo-plugins-ts4nfdi/collection-terminologies"
resource_type = "ontology"
provider_key = "ts4nfdi_fairagro_collection_terminologies"
badge_label = "FAIRagro TS collection"
provider_resource_detail = true
presentation = { adapter = "native" }

[frontend.annotations.matchers.gateway_params]
collectionId = "ff5491d1-d0a9-481e-ac90-0fad065fa097"

# EDAM formats selected in the dataset distribution question.
[[frontend.annotations.matchers]]
id = "fairagro-dataset-format"
question_uri = "https://rdmo.fairagro.net/terms/questions/dmp4nfdi/v1-0-0/DMP/Dataset/Distribution/rdadmp_format"
attribute_uri = "https://rdmorganiser.github.io/terms/domain/project/dataset/format"
optionset_uri = "https://rdmo.fairagro.net/terms/options/ts4nfdi/file_format_grouped"
resource_type = "entity"
badge_label = "EDAM"
ontology_id = "edam"
source_key = "ebi"
presentation = { adapter = "tss", component = "entity-info", entity_type = "class" }

# EDAM formats selected in the plugin's example catalog.
[[frontend.annotations.matchers]]
id = "example-dataset-format"
question_uri = "https://ts4nfdi.github.io/terms/questions/rdmo-plugins-ts4nfdi-example-catalog/data-formats"
attribute_uri = "https://rdmorganiser.github.io/terms/domain/project/dataset/format"
optionset_uri = "https://rdmo.fairagro.net/terms/options/file_format_ts4nfdi"
resource_type = "entity"
badge_label = "EDAM"
ontology_id = "edam"
source_key = "ebi"
presentation = { adapter = "tss", component = "entity-info", entity_type = "class" }

# Controlled agricultural keywords selected on the example catalog's keyword
## page. AGROVOC is exposed through a Skosmos backend, so the plugin resolves
## metadata through the Gateway's source-neutral concept-detail contract and
# uses its native drawer rather than an incompatible OLS/TSS entity component.
[[frontend.annotations.matchers]]
id = "example-agrovoc-keyword"
question_uri = "https://ts4nfdi.github.io/terms/questions/rdmo-plugins-ts4nfdi-example-catalog/dataset-keywords-agrovoc"
attribute_uri = "https://ts4nfdi.github.io/domain/rdmo-plugins-ts4nfdi/dataset-keywords-agrovoc"
optionset_uri = "https://ts4nfdi.github.io/terms/options/rdmo-plugins-ts4nfdi/agrovoc-keywords"
resource_type = "entity"
badge_label = "AGROVOC"
ontology_id = "agrovoc"
source_key = "agrovoc"
presentation = { adapter = "native" }

[[frontend.annotations.matchers]]
id = "example-keyword"
question_uri = "https://ts4nfdi.github.io/terms/questions/rdmo-plugins-ts4nfdi-example-catalog/dataset-keywords"
attribute_uri = "https://rdmo.fairagro.net/terms/domain/rdmo-plugins-ts4nfdi/dataset-keywords"
optionset_uri = "https://rdmo.fairagro.net/terms/options/rdmo-plugins-ts4nfdi/keywords"
resource_type = "entity"
badge_label = "Terminology"
# RDMO stores the selected label and IRI, but not the dynamic provider's
# source/terminology breadcrumb. Resolve that display metadata from the same
# Gateway search contract for this deliberately broad multi-source example.
resolve_summary_metadata = true
presentation = { adapter = "native" }

# FAIRagro data-generation concepts selected from the configured Gateway entity
# set. Entity sets can combine providers and terminologies. The v2 list stays
# metadata-free; on click the plugin recovers the selected entity's upstream
# provenance. OLS2 entries use TSS, while other backends retain the native
# entity-set definition and provenance view.
[[frontend.annotations.matchers]]
id = "example-fairagro-data-generation"
question_uri = "https://ts4nfdi.github.io/terms/questions/rdmo-plugins-ts4nfdi-example-catalog/data-generation-methods"
attribute_uri = "https://rdmorganiser.github.io/terms/domain/project/dataset/creation_methods"
optionset_uri = "https://ts4nfdi.github.io/terms/options/rdmo-plugins-ts4nfdi/fairagro-data-generation"
resource_type = "entity"
provider_key = "ts4nfdi_entitysets"
badge_label = "FAIRagro entity set"
presentation = { adapter = "native" }

# Terminologies selected from the FAIRagro TS4NFDI collection.
[[frontend.annotations.matchers]]
id = "fairagro-metadata-standard"
question_uri = "https://rdmo.fairagro.net/terms/questions/dmp4nfdi/v1-0-0/DMP/Dataset/Metadata/rdadmp_metadata_standard_id/rdadmp_identifier"
attribute_uri = "https://rdmorganiser.github.io/terms/domain/project/dataset/metadata/standards"
optionset_uri = "https://rdmo.fairagro.net/terms/options/ts4nfdi/collection_terminologies"
resource_type = "ontology"
provider_key = "ts4nfdi_fairagro_collection_terminologies"
badge_label = "FAIRAgro"
provider_resource_detail = true
presentation = { adapter = "native" }

[frontend.annotations.matchers.gateway_params]
collectionId = "ff5491d1-d0a9-481e-ac90-0fad065fa097"

